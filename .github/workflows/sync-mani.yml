name: Sync manifest data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: 'source_repo'
          fetch-depth: 1

      - name: Cache output
        uses: actions/cache@v6
        with:
          path: source_repo/tools/ManifestTool/output
          key: ss-manifest-${{ github.run_id }}
          restore-keys: ss-manifest-

      - name: Run tool
        working-directory: source_repo/tools/ManifestTool/
        run: |
          chmod +x ./ManifestTool
          ./ManifestTool --generate-manifest-record

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Sync manifest data and AP data
        working-directory: source_repo
        run: |
          set -u

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          SOURCE_DIR="tools/ManifestTool/output/Manifest"
          TARGET_DIR="resource-manifest"
          AP_DIR="res-ap-manifest"
          VERSION_FILE="$TARGET_DIR/version.json"
          MANIFEST_FILE="resource_manifest.json"
          TOOL_CONFIG="tools/ManifestTool/manifest-tool.toml"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "ManifestTool output directory not found!"
            exit 1
          fi

          rsync -a --delete "$SOURCE_DIR"/ "$TARGET_DIR"/

          if [ ! -f "$VERSION_FILE" ]; then
            echo "version.json not found!"
            exit 1
          fi

          if [ -n "$(git status --porcelain -- "$TARGET_DIR")" ]; then
            RESOURCE_CHANGED=1
            echo "resource-manifest changed, generating AP data first"
          else
            RESOURCE_CHANGED=0
            echo "resource-manifest has no change, skip AP generation"
          fi

          if [ "$RESOURCE_CHANGED" = "1" ]; then
            missing=""
            for region in $(jq -r 'keys[]' "$VERSION_FILE"); do
              [ -f "$TARGET_DIR/$region/$MANIFEST_FILE" ] || missing="$missing $region"
            done

            if [ -n "$missing" ]; then
              echo "Manifest missing for:$missing, abort"
              exit 1
            fi

            node scripts/generate_ap.js
          fi

          if [ "$RESOURCE_CHANGED" = "1" ]; then
            git add "$VERSION_FILE"
            if ! git diff --cached --quiet -- "$VERSION_FILE"; then
              git commit -m "update: resource manifest version.json"
            fi

            for region in $(jq -r 'keys[]' "$VERSION_FILE"); do
              REGION_DIR="$TARGET_DIR/$region"

              if [ ! -d "$REGION_DIR" ]; then
                echo "Directory $REGION_DIR not found, skipping"
                continue
              fi

              git add -A "$REGION_DIR"
              if git diff --cached --quiet -- "$REGION_DIR"; then
                echo "No changes in $region, skipping"
                continue
              fi

              game_ver=$(jq -r ".\"$region\".game_ver" "$VERSION_FILE")
              patch_num=$(jq -r ".\"$region\".patch_num" "$VERSION_FILE")
              patch_ver=$(jq -r ".\"$region\".patch_ver" "$VERSION_FILE")
              region_lower="${region,,}"

              git commit -m "chore(resource): $region_lower $game_ver (v${patch_ver}-p${patch_num})"
            done

            git add -A "$TARGET_DIR"
            if ! git diff --cached --quiet -- "$TARGET_DIR"; then
              git commit -m "chore(resource): sync other manifest files"
            fi
          fi

          if [ -d "$AP_DIR" ]; then
            git add -A "$AP_DIR"
            if ! git diff --cached --quiet -- "$AP_DIR"; then
              git commit -m "chore(ap): update ap data"
            fi
          fi

          if [ -f "$TOOL_CONFIG" ]; then
            git add "$TOOL_CONFIG"
            if ! git diff --cached --quiet -- "$TOOL_CONFIG"; then
              git commit -m "update: manifest-tool.toml"
            fi
          fi

          if [ -z "$(git log origin/main..HEAD --oneline)" ]; then
            echo "Nothing to push"
            exit 0
          fi

          echo "Commits to push:"
          git log origin/main..HEAD --oneline
          git push
